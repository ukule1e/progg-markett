<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маркет PROGG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            padding: 15px;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 2px solid #00ff66;
            margin-bottom: 25px;
        }
        .header h1 {
            font-size: 26px;
            color: #00ff66;
            text-shadow: 0 0 15px rgba(0,255,102,0.4);
            letter-spacing: 2px;
        }
        .user-info {
            text-align: center;
            font-size: 14px;
            color: #aaaaaa;
            margin-bottom: 25px;
            background: #1a1a1a;
            padding: 10px;
            border-radius: 8px;
        }
        .category-title {
            font-size: 20px;
            color: #00ff66;
            margin: 20px 0 15px 0;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .card {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .card:active {
            border-color: #00ff66;
            transform: scale(0.97);
            box-shadow: 0 0 20px rgba(0,255,102,0.2);
        }
        .card-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.3;
        }
        .card-price {
            font-size: 16px;
            color: #00ff66;
            font-weight: bold;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(0,255,102,0.3);
        }
        .btn-buy {
            background: #00ff66;
            color: #0d0d0d;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-buy:active {
            background: #00cc52;
            transform: scale(0.95);
        }
        .card img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛒 МАРКЕТ PROGG</h1>
    </div>
    
    <div class="user-info" id="user-display">
        Загрузка профиля сотрудника...
    </div>

    <div class="category-title">🍺 Меню Бара</div>
    <div class="grid">
        <div class="card">
            <div class="card-name">🥔 Чипсы в ассортименте</div>
            <div class="card-price">120 баллов</div>
            <button class="btn-buy" onclick="buyItem('chips', '🥔 Чипсы в ассортименте', 120)">Взять</button>
        </div>
        <div class="card">
            <div class="card-name">🍫 Chocolate батончик</div>
            <div class="card-price">80 баллов</div>
            <button class="btn-buy" onclick="buyItem('chocolate', '🍫 Шоколадный батончик', 80)">Взять</button>
        </div>
        <div class="card">
            <div class="card-name">💧 Чистая вода (б/г)</div>
            <div class="card-price">50 баллов</div>
            <button class="btn-buy" onclick="buyItem('water', '💧 Чистая вода (без газа)', 50)">Взять</button>
        </div>
    </div>

    <div class="category-title">❄️ Холодильник</div>
    <div class="grid">
        <div class="card">
            <img src="https://raw.githubusercontent.com/ukule1e/progg-markett/main/monster%20nitro.png" alt="Энергетик">
            <div class="card-name">⚡️ Энергетик PROGG ENERGY</div>
            <div class="card-price">180 баллов</div>
            <button class="btn-buy" onclick="buyItem('energy', '⚡️ Энергетический напиток', 180)">Взять</button>
        </div>
        <div class="card">
            <div class="card-name">🧋 Холодный чай (Lipton/Fuze)</div>
            <div class="card-price">110 баллов</div>
            <button class="btn-buy" onclick="buyItem('cold_tea', '🧋 Холодный чай (Lipton/Fuze)', 110)">Взять</button>
        </div>
        <div class="card">
            <div class="card-name">🥤 Газировка в банке</div>
            <div class="card-price">100 баллов</div>
            <button class="btn-buy" onclick="buyItem('soda', '🥤 Газировка в банке', 100)">Взять</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-display').innerText = '👤 Сотрудник: @' + (user.username || user.first_name);
        } else {
            document.getElementById('user-display').innerText = '👤 Режим покупок активирован';
        }
        
        function buyItem(id, name, price) {
            const orderData = {
                item_id: id,
                item_name: name,
                item_price: price
            };
            tg.sendData(JSON.stringify(orderData));
            tg.close();
        }
    </script>
</body>
</html>
